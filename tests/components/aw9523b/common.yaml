aw9523b:
  - id: aw9523b_with_interrupt
    interrupt_pin: ${interrupt_pin}
  - id: aw9523b_polling

binary_sensor:
  - platform: gpio
    name: AW9523B Interrupt Input
    pin:
      aw9523b_id: aw9523b_with_interrupt
      number: 0
      mode: INPUT
  - platform: gpio
    name: AW9523B Polled Input On Interrupt Device
    pin:
      aw9523b_id: aw9523b_with_interrupt
      number: 1
      mode: INPUT
      use_interrupt: false
  - platform: gpio
    name: AW9523B Input Without Interrupt Pin
    pin:
      aw9523b_id: aw9523b_polling
      number: 0
      mode: INPUT
